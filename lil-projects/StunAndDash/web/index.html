<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stun & Dash</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #07110d; color: #e8e2c8; font-family: ui-monospace, monospace; }
      #app { min-height: 100vh; display: grid; place-items: center; }
      #game { width: min(960px, 100vw); aspect-ratio: 16 / 9; border: 2px solid #88b04b; box-shadow: 0 0 40px #0008; }
      canvas { display: block; width: 100% !important; height: 100% !important; }
    </style>
  </head>
  <body>
    <div id="app"><div id="game"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
