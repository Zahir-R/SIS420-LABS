[tool.uv]
python-preference = "only-system"

[project]
name = "stun-and-dash"
version = "0.1.0"
description = "Stun & Dash: adversarial stochastic platformer with Bellman and Q-Learning"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest",
  "black",
  "flake8",
]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
