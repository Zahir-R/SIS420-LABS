[tool.uv]
python-preference = "only-system"

[project]
name = "ai1"
version = "0.1.0"
description = "IA1 / ML notebooks (Python 3.11)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "scipy",
  "jupyterlab",
  "ipykernel",
  "nbformat",
  "nbclient",
  "nbconvert",
  "jupytext",
  "pynvim",
  "pyperclip",
]

[dependency-groups]
dev = [
  "black",
  "flake8",
]
